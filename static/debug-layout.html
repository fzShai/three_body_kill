<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>layout debug</title>
  <link rel="stylesheet" href="/static/css/tokens.css" />
  <link rel="stylesheet" href="/static/css/shell.css" />
  <link rel="stylesheet" href="/static/css/motion.css" />
  <link rel="stylesheet" href="/static/css/table-board.css?v=20260727b" />
</head>
<body class="shell-page table-page">
  <button type="button" class="btn btn-outline log-toggle" id="logToggleBtn">战报</button>
  <div class="log-backdrop" id="logBackdrop"></div>
  <aside class="log-drawer" id="logDrawer" aria-hidden="true">
    <h2>战报</h2>
    <div class="log" id="log"><div>sample log</div></div>
  </aside>
  <div class="board">
    <header class="board-top"><div class="brand-mini">黑暗森林</div></header>
    <div class="board-arena">
      <div class="stage idle" id="stage"><div class="stage-text">stage visible?</div></div>
    </div>
    <section class="board-self">
      <div class="self-role">role</div>
      <div class="self-hand-wrap"><div class="hand" id="hand"><div class="card">card</div></div></div>
      <div class="self-equip">equip</div>
    </section>
    <div class="action-bar"><button class="btn">出牌</button></div>
  </div>
  <pre id="out" style="position:fixed;left:0;bottom:0;z-index:9999;background:#000;color:#0f0;font:11px monospace;max-height:40vh;overflow:auto;width:100%;"></pre>
  <script>
    function measure() {
      const drawer = document.getElementById('logDrawer');
      const board = document.querySelector('.board');
      const stage = document.getElementById('stage');
      const dcs = getComputedStyle(drawer);
      const bcs = getComputedStyle(board);
      const dr = drawer.getBoundingClientRect();
      const br = board.getBoundingClientRect();
      const sr = stage.getBoundingClientRect();
      const payload = {
        sessionId: 'c8052d',
        runId: 'agent-repro',
        hypothesisId: 'A',
        location: 'debug-layout.html',
        message: 'css-specificity-layout',
        timestamp: Date.now(),
        data: {
          drawerPosition: dcs.position,
          drawerTransform: dcs.transform,
          drawerRect: { left: dr.left, top: dr.top, w: dr.width, h: dr.height },
          boardRect: { left: br.left, top: br.top, w: br.width, h: br.height },
          stageRect: { left: sr.left, top: sr.top, w: sr.width, h: sr.height },
          stageInView: sr.top < innerHeight && sr.bottom > 0 && sr.height > 0,
          boardInView: br.top < innerHeight && br.bottom > 0,
          bodyOverflow: getComputedStyle(document.body).overflow,
          vh: innerHeight,
        }
      };
      document.getElementById('out').textContent = JSON.stringify(payload, null, 2);
      fetch('http://127.0.0.1:7458/ingest/e5a47139-64a7-4168-8d28-2940c0a64ab2',{method:'POST',headers:{'Content-Type':'application/json','X-Debug-Session-Id':'c8052d'},body:JSON.stringify(payload)}).catch(()=>{});
      fetch('/api/debug-log',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).catch(()=>{});
    }
    measure();
    setTimeout(measure, 300);
  </script>
</body>
</html>
