<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>三体杀 - 桌面</title>
    <link rel="stylesheet" href="/static/css/tokens.css" />
    <link rel="stylesheet" href="/static/css/shell.css" />
    <link rel="stylesheet" href="/static/css/motion.css" />
    <link rel="stylesheet" href="/static/css/table-board.css" />
</head>
<body class="shell-page table-page">
    <button type="button" class="btn btn-outline log-toggle" id="logToggleBtn">战报</button>
    <div class="log-backdrop" id="logBackdrop"></div>
    <aside class="log-drawer" id="logDrawer" aria-hidden="true">
        <h2>战报</h2>
        <div class="log" id="log"></div>
        <div class="row" style="margin-top:14px;">
            <a class="btn btn-outline" href="/lobby" id="backLobbyLink">回大厅</a>
        </div>
    </aside>

    <div class="board">
        <header class="board-top">
            <div class="brand-mini">黑暗森林</div>
            <div class="meta">
                房号 <span id="roomIdDisplay"></span>
                · 阶段 <span id="phaseLabel">—</span>
                · 弃牌堆 <span id="discardCount">0</span>
                · 倒计时 <span id="turnTimer">—</span>
            </div>
        </header>

        <div class="board-arena">
            <div class="table-felt" aria-hidden="true"></div>
            <div class="seat-ring" id="seatRing"></div>
            <div class="stage idle" id="stage">
                <div id="stageCardSlot"></div>
                <div class="stage-text" id="stageText">等待对局</div>
                <div class="stage-sub" id="stageSub"></div>
            </div>
        </div>

        <section class="board-self">
            <div class="self-role" id="roleBox">—</div>
            <div class="self-hand-wrap">
                <div class="mode-hint" id="modeHint"></div>
                <div class="hand" id="hand"></div>
            </div>
            <div class="self-equip" id="selfEquip">
                <h3>装备</h3>
                <div id="selfEquipBody">—</div>
            </div>
        </section>

        <div class="action-bar" id="actionBar">
            <button class="btn" id="playBtn" type="button">出牌</button>
            <button class="btn btn-outline" id="cancelSelectBtn" type="button" hidden>取消选牌</button>
            <button class="btn btn-outline" id="endPlayBtn" type="button">结束出牌</button>
            <button class="btn btn-outline" id="discardDoneBtn" type="button" hidden>完成弃牌</button>
            <button class="btn btn-outline" id="techDiscardBtn" type="button">弃置升科技</button>
            <button class="btn btn-outline" id="techConfirmBtn" type="button" hidden>确认升科技</button>
            <button class="btn btn-outline" id="techCancelBtn" type="button" hidden>取消</button>
            <button class="btn btn-outline" id="respondPassBtn" type="button" hidden>不响应</button>
            <span id="choiceBtns" hidden></span>
            <button class="btn btn-outline" id="wanderAcceptBtn" type="button" hidden>发动流浪</button>
            <button class="btn btn-outline" id="wanderPassBtn" type="button" hidden>放弃流浪</button>
            <button class="btn btn-outline" id="benevolenceBtn" type="button" hidden>仁心治疗</button>
            <button class="btn btn-outline" id="madonnaAcceptBtn" type="button" hidden>发动圣母</button>
            <button class="btn btn-outline" id="madonnaPassBtn" type="button" hidden>放弃圣母</button>
            <button class="btn btn-outline" id="flyingBladeBtn" type="button" hidden>飞刃</button>
            <button class="btn btn-outline" id="curvatureBtn" type="button" hidden>曲率判定</button>
            <button class="btn btn-outline" id="gravityAcceptBtn" type="button" hidden>引力覆盖</button>
            <button class="btn btn-outline" id="gravityPassBtn" type="button" hidden>放弃引力</button>
            <button class="btn btn-outline" id="ultimateLawBtn" type="button" hidden>终极规律</button>
            <button class="btn btn-outline" id="dyingPassBtn" type="button" hidden>结算濒死</button>
            <button class="btn btn-outline" id="recastBtn" type="button">重铸</button>
            <div class="status" id="statusMsg"></div>
        </div>
    </div>

    <script src="/static/app.js"></script>
    <script>
        const username = TBK.requireLogin();
        const roomId = TBK.roomIdFromPathOrQuery();
        if (!username) {}
        else if (!roomId) { window.location.href = '/lobby'; }
        else {
            document.getElementById('roomIdDisplay').textContent = roomId;
            let state = null;
            let selectedId = null;
            let selectedIds = new Set();
            let selectedTarget = null;
            let targetingMode = null; // null | 'card' | 'benevolence' | 'ultimate_law'
            let uiMode = 'play'; // play | discard | tech_discard
            let turnDeadlineMs = null;
            let lastStageKey = '';
            const statusMsg = document.getElementById('statusMsg');
            const turnTimerEl = document.getElementById('turnTimer');

            function setStatus(text, kind) {
                statusMsg.textContent = text || '';
                statusMsg.className = 'status' + (kind ? ' ' + kind : '');
            }

            function setHidden(el, hidden) {
                if (!el) return;
                if (hidden) el.setAttribute('hidden', '');
                else el.removeAttribute('hidden');
            }

            const SLOT_LABEL = {
                stellar_track: '恒星航迹',
                stability_system: '维稳系统',
                ship: '船',
                armor: '甲',
                temp_ascend: '临时飞升',
            };

            const TEMP_ASCEND_IDS = new Set(['nano_center', 'chip_workshop', 'stars_plan']);

            function needsOtherTarget(card) {
                const ids = new Set([
                    'ladder_plan', 'ball_lightning', 'sophon', 'wallfacer_plan', 'broadcast',
                    'toxic_water', 'four_dimension', 'deadline', 'dual_vector', 'soap',
                    'great_ravine', 'killer_52', 'reckoning', 'finale',
                ]);
                return card && (
                    card.subtype === 'kill'
                    || card.id === 'kill_low' || card.id === 'kill_high' || card.id === 'kill_t3'
                    || ids.has(card.id)
                );
            }

            function isPeach(card) {
                return card && (card.subtype === 'heal' || card.id === 'peach');
            }

            function isBasic(card) {
                if (!card) return false;
                if (['kill', 'dodge', 'heal', 'visitor'].includes(card.subtype)) return true;
                return card.id === 'peach' || card.id === 'visitor';
            }

            const ASCENSION_LABEL = {
                mech: '机械飞升',
                cyber: '义体飞升',
                gene: '基因飞升',
                psychic: '灵能飞升',
            };

            function equipLine(equipment, slot) {
                const card = equipment && equipment[slot];
                const label = SLOT_LABEL[slot] || slot;
                if (card && card.name) {
                    return `<div class="filled">${label}：${card.name}</div>`;
                }
                return `<div>${label}：空</div>`;
            }

            function cardTypeLabel(c) {
                if (!c) return '';
                if (c.subtype === 'kill') return `${c.tier || '?'}阶杀`;
                if (c.subtype === 'dodge') return `${c.tier || '?'}阶闪`;
                if (c.subtype === 'heal') return `桃 · 回复${c.heal || 2}`;
                if (c.subtype === 'visitor') return '基本 · 天外来客';
                if (TEMP_ASCEND_IDS.has(c.id) || c.slot === 'temp_ascend') return '临时飞升';
                if (c.type === 'equipment') return `装备 · ${SLOT_LABEL[c.slot] || c.slot || ''}`;
                return c.type || '牌';
            }

            function syncUiMode(snap) {
                const myTurn = snap.current_player === username && snap.phase === 'turn';
                if (!myTurn || snap.phase !== 'turn') {
                    if (uiMode === 'tech_discard') uiMode = 'play';
                    if (snap.phase !== 'turn' || snap.turn_phase !== 'discard') {
                        if (uiMode === 'discard') uiMode = 'play';
                    }
                    return;
                }
                if (snap.turn_phase === 'discard') {
                    if (uiMode !== 'discard') {
                        selectedIds.clear();
                        selectedId = null;
                        selectedTarget = null;
                        targetingMode = null;
                    }
                    uiMode = 'discard';
                    return;
                }
                if (snap.turn_phase === 'play' && uiMode === 'discard') {
                    uiMode = 'play';
                    selectedIds.clear();
                }
                if (snap.turn_phase !== 'play' && uiMode === 'tech_discard') {
                    uiMode = 'play';
                    selectedIds.clear();
                }
            }

            function discardNeed(snap) {
                const you = snap.you || {};
                const handCount = (you.hand || []).length;
                const limit = you.hand_limit ?? handCount;
                return Math.max(0, handCount - limit);
            }

            /** Relative seat positions: self at bottom (index 0 of rotated order). */
            function seatPositions(count) {
                // Angles for others only; self is in bottom zone.
                // Positions around ellipse: angle 0 = bottom, clockwise.
                if (count <= 1) return [];
                const others = count - 1;
                const positions = [];
                for (let i = 0; i < others; i++) {
                    // Spread from ~200° to ~340° via top (avoid bottom self zone)
                    const t = others === 1 ? 0.5 : i / (others - 1);
                    const angle = Math.PI + t * Math.PI; // π … 2π (left → top → right)
                    // Convert: 0 at right, CCW in math; we use cos/sin with top-up
                    // angle: π left, 1.5π top, 2π right
                    const x = 50 + 42 * Math.cos(angle);
                    const y = 48 + 38 * Math.sin(angle);
                    positions.push({ left: x + '%', top: y + '%' });
                }
                // For 2 players: single opponent at top
                if (others === 1) {
                    return [{ left: '50%', top: '14%' }];
                }
                return positions;
            }

            function hpPips(hp, maxHp) {
                const maxShow = Math.min(Math.max(maxHp || 0, 0), 12);
                let html = '';
                for (let i = 0; i < maxShow; i++) {
                    html += `<span class="hp-pip${i < hp ? '' : ' empty'}"></span>`;
                }
                return html;
            }

            function legalTargets(snap, mode, card) {
                const players = snap.players || [];
                const others = players.filter((p) => p.alive && p.username !== username);
                const allAlive = players.filter((p) => p.alive);
                if (mode === 'benevolence') return allAlive.map((p) => p.username);
                if (mode === 'ultimate_law') return others.map((p) => p.username);
                if (!card) return [];
                if (isPeach(card) && snap.phase === 'dying' && snap.dying) {
                    return [snap.dying.victim];
                }
                if (isPeach(card)) return [username];
                if (card.id === 'ladder_plan') {
                    return others.filter((p) => !p.vision_exposed).map((p) => p.username);
                }
                if (needsOtherTarget(card)) return others.map((p) => p.username);
                return [];
            }

            function syncTargetingFromSelection(snap) {
                const hand = snap.you?.hand || [];
                const card = hand.find((c) => c.instance_id === selectedId);
                const prompt = snap.prompt;
                const isBenevolence = snap.phase === 'prompt' && prompt?.type === 'benevolence_heal' && prompt.to === username;
                const inPlay = snap.current_player === username && snap.phase === 'turn' && snap.turn_phase === 'play';

                if (isBenevolence) {
                    targetingMode = 'benevolence';
                    return;
                }
                if (inPlay && snap.you?.ultimate_law_ready && !selectedId && targetingMode === 'ultimate_law') {
                    return;
                }
                if (uiMode === 'discard' || uiMode === 'tech_discard') {
                    targetingMode = null;
                    selectedTarget = null;
                    return;
                }
                if (card && needsOtherTarget(card) && !(isPeach(card))) {
                    targetingMode = 'card';
                    const legal = legalTargets(snap, 'card', card);
                    if (selectedTarget && !legal.includes(selectedTarget)) selectedTarget = null;
                    return;
                }
                if (card && isPeach(card) && snap.phase === 'dying') {
                    targetingMode = null;
                    selectedTarget = snap.dying?.victim || null;
                    return;
                }
                if (targetingMode === 'ultimate_law' && !selectedId) return;
                targetingMode = null;
                if (!(card && isPeach(card))) {
                    // keep target only when still in card targeting
                }
                if (!needsOtherTarget(card)) selectedTarget = isPeach(card) ? username : null;
            }

            setInterval(() => {
                if (!turnDeadlineMs || !state || !['turn', 'prompt', 'dying'].includes(state.phase)) {
                    turnTimerEl.textContent = '—';
                    return;
                }
                const left = Math.max(0, Math.ceil((turnDeadlineMs - Date.now()) / 1000));
                turnTimerEl.textContent = left + 's';
            }, 200);

            function renderStage(snap) {
                const stageEl = document.getElementById('stage');
                const stageCardSlot = document.getElementById('stageCardSlot');
                const stageText = document.getElementById('stageText');
                const stageSub = document.getElementById('stageSub');
                const st = snap.stage || {};
                const key = `${st.kind}|${st.text}|${st.card?.name || ''}|${snap.seq || ''}`;
                stageEl.className = 'stage';
                if (st.kind === 'dying') stageEl.classList.add('dying', 'deterrence-pulse');
                else if (st.kind === 'ended') stageEl.classList.add('ended', 'ended-banner');
                else if (!st.kind || st.kind === 'idle') stageEl.classList.add('idle');

                if (st.card && st.card.name) {
                    const enter = key !== lastStageKey ? ' stage-enter' : '';
                    stageCardSlot.innerHTML = `<div class="stage-card${enter}"><div class="cname">${st.card.name}</div><div class="ctype">${cardTypeLabel(st.card)}</div></div>`;
                } else {
                    stageCardSlot.innerHTML = '';
                }
                stageText.textContent = st.text || (snap.current_player ? `${snap.current_player} 的回合` : '等待');
                const bits = [];
                if (st.from) bits.push(`来自 ${st.from}`);
                if (st.to) bits.push(`目标 ${st.to}`);
                stageSub.textContent = bits.join(' · ');
                lastStageKey = key;
            }

            function renderSeats(snap, ctx) {
                const order = snap.player_order || (snap.players || []).map((p) => p.username);
                const myIdx = order.indexOf(username);
                const rotated = myIdx >= 0
                    ? [...order.slice(myIdx), ...order.slice(0, myIdx)]
                    : order.slice();
                // rotated[0] is self; others follow
                const others = rotated.slice(1);
                const positions = seatPositions(rotated.length);
                const playersByName = Object.fromEntries((snap.players || []).map((p) => [p.username, p]));
                const legal = (() => {
                    if (ctx.myBenevolence) return legalTargets(snap, 'benevolence', null);
                    if (targetingMode === 'ultimate_law') return legalTargets(snap, 'ultimate_law', null);
                    if (targetingMode === 'card') {
                        const card = (snap.you?.hand || []).find((c) => c.instance_id === selectedId);
                        return legalTargets(snap, 'card', card);
                    }
                    return [];
                })();
                const canPickSeat = legal.length > 0;

                const ring = document.getElementById('seatRing');
                ring.innerHTML = others.map((name, i) => {
                    const p = playersByName[name];
                    if (!p) return '';
                    const pos = positions[i] || { left: '50%', top: '20%' };
                    const isVictim = ctx.isDying && p.username === ctx.dying.victim;
                    const isLegal = legal.includes(p.username);
                    const cls = [
                        'seat-panel',
                        (!ctx.isPrompt && !ctx.isDying && p.username === snap.current_player) ? 'turn' : '',
                        isVictim ? 'dying-victim deterrence-pulse' : '',
                        (ctx.isPrompt && p.username === ctx.prompt.to) ? 'prompt-active' : '',
                        p.alive ? '' : 'dead',
                        p.online === false ? 'offline' : '',
                        selectedTarget === p.username ? 'selected-target' : '',
                        canPickSeat && isLegal ? 'targetable' : '',
                        canPickSeat && !isLegal ? 'dim-target' : '',
                    ].filter(Boolean).join(' ');
                    const flags = [];
                    if (p.vision_exposed) flags.push('视野暴露');
                    if (p.skills_sealed) flags.push('技封');
                    if (p.ascension) flags.push(ASCENSION_LABEL[p.ascension] || p.ascension);
                    if (!p.alive) flags.push('出局');
                    return `<div class="${cls}" data-user="${p.username}" style="left:${pos.left};top:${pos.top}">
                        <div class="seat-name">${p.username}${p.online === false ? '<span class="badge-off">离线</span>' : ''}</div>
                        <div class="seat-stats">科技${p.tech_level ?? 1} · 手牌 ${p.hand_count}${p.shield ? ` · 盾${p.shield}` : ''}</div>
                        <div class="hp-row">${hpPips(p.hp, p.max_hp)}</div>
                        <div class="seat-eq">${equipLine(p.equipment, 'ship')}${equipLine(p.equipment, 'armor')}</div>
                        ${flags.length ? `<div class="seat-flags">${flags.join(' · ')}</div>` : ''}
                    </div>`;
                }).join('');

                ring.querySelectorAll('.seat-panel.targetable').forEach((el) => {
                    el.addEventListener('click', () => {
                        selectedTarget = el.getAttribute('data-user');
                        setStatus(`目标：${selectedTarget}`);
                        render(state);
                    });
                });
            }

            function render(snap) {
                state = snap;
                turnDeadlineMs = snap.turn_deadline_ms || null;
                syncUiMode(snap);
                syncTargetingFromSelection(snap);
                document.getElementById('discardCount').textContent = snap.discard_count ?? 0;
                const phaseMap = { turn: '回合', prompt: '响应', dying: '濒死', ended: '结束' };
                const tp = snap.turn_phase ? ({ draw: '摸牌', play: '出牌', discard: '弃牌' }[snap.turn_phase] || snap.turn_phase) : '';
                document.getElementById('phaseLabel').textContent = (phaseMap[snap.phase] || snap.phase) + (tp ? '/' + tp : '');

                const prompt = snap.prompt;
                const dying = snap.dying;
                const isPrompt = snap.phase === 'prompt' && prompt;
                const isDying = snap.phase === 'dying' && dying;
                const myTurn = snap.current_player === username && snap.phase === 'turn';
                const isWander = isPrompt && prompt.type === 'wander_draw';
                const myWander = isWander && prompt.to === username;
                const isBenevolence = isPrompt && prompt.type === 'benevolence_heal';
                const myBenevolence = isBenevolence && prompt.to === username;
                const isMadonna = isPrompt && prompt.type === 'madonna_save';
                const myMadonna = isMadonna && prompt.to === username;
                const isGravity = isPrompt && prompt.type === 'gravity_override';
                const myGravity = isGravity && prompt.to === username;
                const isChoice = isPrompt && prompt.type === 'choice';
                const isInterrupt = isPrompt && (prompt.type === 'interrupt_trick' || prompt.type === 'respond_toxic');
                const myChoice = isChoice && prompt.to === username;
                const myInterrupt = isInterrupt && prompt.to === username;
                const isDodgePrompt = isPrompt && prompt.type === 'respond_dodge';
                const myPrompt = isPrompt && prompt.to === username;
                const myDying = isDying && dying.victim === username;
                const canSaveDying = isDying && snap.you?.alive !== false;
                const inPlay = myTurn && snap.turn_phase === 'play';
                const inDiscard = myTurn && snap.turn_phase === 'discard';
                const need = discardNeed(snap);

                const ctx = { isPrompt, isDying, dying, prompt, myBenevolence };
                document.body.classList.toggle('table-ended', snap.phase === 'ended');
                renderStage(snap);
                renderSeats(snap, ctx);

                const hint = document.getElementById('modeHint');
                if (uiMode === 'tech_discard') {
                    hint.textContent = `弃置升科技：已选 ${selectedIds.size}/4 张基本牌`;
                } else if (inDiscard) {
                    hint.textContent = need > 0
                        ? `弃牌阶段：还需弃置 ${need} 张（已选 ${selectedIds.size}）`
                        : '手牌已达上限，可点击「完成弃牌」';
                } else if (myWander) {
                    hint.textContent = '【流浪】：是否失去 1 点体力并摸两张牌？';
                } else if (myBenevolence) {
                    hint.textContent = selectedTarget
                        ? `【仁心】目标 ${selectedTarget} · 点击「仁心治疗」`
                        : '【仁心】：点击座位选择治疗目标';
                } else if (myMadonna) {
                    hint.textContent = `【圣母】：是否救治濒死的 ${prompt.victim}？`;
                } else if (myGravity) {
                    hint.textContent = '万有引力号：先选两张手牌，再点「引力覆盖」';
                } else if (isDying) {
                    hint.textContent = myDying
                        ? '你濒死：打出桃自救，或点击「结算濒死」'
                        : `${dying.victim} 濒死：可打出桃救人`;
                } else if (targetingMode === 'ultimate_law') {
                    hint.textContent = selectedTarget
                        ? `终极规律目标 ${selectedTarget} · 点击「终极规律」确认`
                        : '终极规律：点击座位选择复制目标';
                } else if (targetingMode === 'card' && selectedId) {
                    hint.textContent = selectedTarget
                        ? `已选目标 ${selectedTarget} · 点击「出牌」确认`
                        : '请点击座位选择目标';
                } else if (inPlay) {
                    hint.textContent = '出牌阶段：点选手牌，需要目标时再点座位，然后确认';
                } else {
                    hint.textContent = '';
                }

                const role = snap.you?.role;
                const you = snap.you || {};
                const mePublic = (snap.players || []).find((p) => p.username === username) || {};
                const skillText = (role?.skills || []).map((s) =>
                    `${s.locked ? '【锁定】' : ''}${s.name}`
                ).join(' · ');
                const sealedYou = you.skills_sealed ? ' · 非锁定技失效' : '';
                document.getElementById('roleBox').innerHTML = role
                    ? `<div class="role-name">${role.role_name}</div>
                        HP ${you.hp}/${mePublic.max_hp ?? you.hp} · 科技${you.tech_level ?? 1} · 上限${you.hand_limit ?? '—'}${sealedYou}
                        <div class="hp-row">${hpPips(you.hp, mePublic.max_hp || you.hp)}</div>
                        ${skillText ? `<div class="role-skills">${skillText}</div>` : ''}`
                    : '—';

                const roleBox = document.getElementById('roleBox');
                roleBox.classList.toggle('selected-target', selectedTarget === username && !!myBenevolence);
                roleBox.style.cursor = myBenevolence ? 'pointer' : '';
                roleBox.onclick = myBenevolence ? () => {
                    selectedTarget = username;
                    setStatus('目标：自己');
                    render(state);
                } : null;

                document.getElementById('selfEquipBody').innerHTML =
                    equipLine(mePublic.equipment || you.equipment, 'ship')
                    + equipLine(mePublic.equipment || you.equipment, 'armor');

                const hand = you.hand || [];
                const handEl = document.getElementById('hand');
                const multiSelect = uiMode === 'discard' || uiMode === 'tech_discard' || myGravity;
                handEl.innerHTML = hand.map((c) => {
                    let dim = '';
                    if (isWander || isBenevolence || isMadonna) dim = 'dim';
                    else if (isGravity) dim = '';
                    else if (isInterrupt) {
                        const ok = c.id === 'thought_stamp' || c.id === 'return_motion'
                            || (prompt.type === 'respond_toxic' && (c.subtype === 'kill' || c.id === 'thought_stamp'));
                        dim = ok ? '' : 'dim';
                    } else if (isPrompt) {
                        dim = c.subtype === 'dodge' ? '' : 'dim';
                    }
                    if (isDying) dim = (c.subtype === 'heal' || c.id === 'peach') ? '' : 'dim';
                    if (uiMode === 'tech_discard' && !isBasic(c)) dim = 'dim';
                    const selected = multiSelect
                        ? selectedIds.has(c.instance_id)
                        : selectedId === c.instance_id;
                    return `<div class="card card-lift ${selected ? 'selected' : ''} ${dim}" data-id="${c.instance_id}" data-subtype="${c.subtype || ''}" data-card-id="${c.id || ''}">
                        <div class="cname">${c.name}</div>
                        <div class="ctype">${cardTypeLabel(c)}</div>
                        <div class="ctext">${c.text || ''}</div>
                    </div>`;
                }).join('') || '<div style="color:rgba(255,255,255,0.25);font-size:13px;padding:20px;">无手牌</div>';

                handEl.querySelectorAll('.card').forEach((el) => {
                    el.addEventListener('click', () => {
                        if (el.classList.contains('dim')) return;
                        const id = el.getAttribute('data-id');
                        if (uiMode === 'discard') {
                            if (selectedIds.has(id)) selectedIds.delete(id);
                            else selectedIds.add(id);
                            selectedId = null;
                            render(state);
                            return;
                        }
                        if (uiMode === 'tech_discard') {
                            const card = hand.find((c) => c.instance_id === id);
                            if (!isBasic(card)) return;
                            if (selectedIds.has(id)) selectedIds.delete(id);
                            else if (selectedIds.size < 4) selectedIds.add(id);
                            selectedId = null;
                            render(state);
                            return;
                        }
                        if (myGravity) {
                            if (selectedIds.has(id)) selectedIds.delete(id);
                            else if (selectedIds.size < 2) selectedIds.add(id);
                            selectedId = null;
                            render(state);
                            return;
                        }
                        if (selectedId === id) {
                            selectedId = null;
                            selectedTarget = null;
                            targetingMode = targetingMode === 'ultimate_law' ? 'ultimate_law' : null;
                        } else {
                            selectedId = id;
                            selectedIds.clear();
                            targetingMode = null;
                            const card = hand.find((c) => c.instance_id === id);
                            if (card && needsOtherTarget(card) && !isPeach(card)) {
                                targetingMode = 'card';
                                selectedTarget = null;
                            } else if (isPeach(card)) {
                                selectedTarget = isDying ? dying.victim : username;
                            } else {
                                selectedTarget = null;
                            }
                        }
                        render(state);
                    });
                });

                // —— Action bar visibility ——
                const playBtn = document.getElementById('playBtn');
                const cancelSelectBtn = document.getElementById('cancelSelectBtn');
                const selectedCard = hand.find((c) => c.instance_id === selectedId);
                const needsTarget = selectedCard && needsOtherTarget(selectedCard) && !isPeach(selectedCard);
                const hasRequiredTarget = !needsTarget || !!selectedTarget;

                let canPlay = ((inPlay && uiMode === 'play') || (myPrompt && !isWander && !isBenevolence && !isMadonna && !isGravity && !isChoice) || canSaveDying) && selectedId && hasRequiredTarget;
                playBtn.disabled = !canPlay;
                playBtn.textContent =
                    inDiscard ? '弃置所选'
                    : (uiMode === 'tech_discard' ? '—'
                    : (isDying && !myDying ? '救人'
                    : (isDying ? '自救'
                    : (isDodgePrompt && myPrompt ? '出闪' : '出牌'))));
                if (inDiscard) {
                    playBtn.disabled = selectedIds.size === 0;
                    playBtn.textContent = '弃置所选';
                    setHidden(playBtn, false);
                } else if (uiMode === 'tech_discard' || isWander || isBenevolence || isMadonna || isChoice || myGravity) {
                    setHidden(playBtn, true);
                } else {
                    setHidden(playBtn, false);
                }

                setHidden(cancelSelectBtn, !(selectedId || selectedIds.size || targetingMode === 'ultimate_law'));
                cancelSelectBtn.disabled = false;

                setHidden(document.getElementById('endPlayBtn'), inDiscard || uiMode === 'tech_discard' || isWander || isPrompt || isDying);
                document.getElementById('endPlayBtn').disabled = !(inPlay && uiMode === 'play');

                const discardDoneBtn = document.getElementById('discardDoneBtn');
                setHidden(discardDoneBtn, !inDiscard);
                discardDoneBtn.disabled = !(inDiscard && need === 0);

                const techDiscardBtn = document.getElementById('techDiscardBtn');
                const techConfirmBtn = document.getElementById('techConfirmBtn');
                const techCancelBtn = document.getElementById('techCancelBtn');
                setHidden(techDiscardBtn, !(inPlay && uiMode === 'play'));
                techDiscardBtn.disabled = !inPlay;
                setHidden(techConfirmBtn, uiMode !== 'tech_discard');
                setHidden(techCancelBtn, uiMode !== 'tech_discard');
                techConfirmBtn.disabled = !(uiMode === 'tech_discard' && selectedIds.size === 4);

                setHidden(document.getElementById('recastBtn'), inDiscard || uiMode === 'tech_discard' || isWander || isPrompt || isDying);
                document.getElementById('recastBtn').disabled = !(inPlay && uiMode === 'play' && selectedId);

                const respondPassBtn = document.getElementById('respondPassBtn');
                const hidePassTypes = isWander || isChoice || isBenevolence || isMadonna || isGravity;
                setHidden(respondPassBtn, !(isPrompt && !hidePassTypes));
                respondPassBtn.disabled = !(myPrompt || myInterrupt) || hidePassTypes;
                respondPassBtn.textContent = isInterrupt ? '不响应/不打断' : '不响应';

                const choiceBtns = document.getElementById('choiceBtns');
                if (isChoice && myChoice) {
                    setHidden(choiceBtns, false);
                    choiceBtns.innerHTML = (prompt.options || []).map((o) =>
                        `<button class="btn" type="button" data-choice="${o.id}">${o.label}</button>`
                    ).join('');
                    choiceBtns.querySelectorAll('button').forEach((btn) => {
                        btn.addEventListener('click', () => {
                            sock.send('game_action', { action: 'choose', choice: btn.getAttribute('data-choice') }, roomId);
                        });
                    });
                } else {
                    setHidden(choiceBtns, true);
                    choiceBtns.innerHTML = '';
                }

                setHidden(document.getElementById('wanderAcceptBtn'), !isWander);
                setHidden(document.getElementById('wanderPassBtn'), !isWander);
                document.getElementById('wanderAcceptBtn').disabled = !myWander;
                document.getElementById('wanderPassBtn').disabled = !myWander;

                setHidden(document.getElementById('benevolenceBtn'), !isBenevolence);
                document.getElementById('benevolenceBtn').disabled = !myBenevolence || !selectedTarget;

                setHidden(document.getElementById('madonnaAcceptBtn'), !isMadonna);
                setHidden(document.getElementById('madonnaPassBtn'), !isMadonna);
                document.getElementById('madonnaAcceptBtn').disabled = !myMadonna;
                document.getElementById('madonnaPassBtn').disabled = !myMadonna;

                setHidden(document.getElementById('flyingBladeBtn'), !(inPlay && you.flying_blade_ready));
                document.getElementById('flyingBladeBtn').disabled = !(inPlay && you.flying_blade_ready);

                setHidden(document.getElementById('curvatureBtn'), !(isDodgePrompt && myPrompt && prompt.curvature));
                document.getElementById('curvatureBtn').disabled = !(isDodgePrompt && myPrompt && prompt.curvature);

                setHidden(document.getElementById('gravityAcceptBtn'), !isGravity);
                setHidden(document.getElementById('gravityPassBtn'), !isGravity);
                document.getElementById('gravityAcceptBtn').disabled = !myGravity || selectedIds.size !== 2;
                document.getElementById('gravityPassBtn').disabled = !myGravity;

                const ultimateLawBtn = document.getElementById('ultimateLawBtn');
                setHidden(ultimateLawBtn, !(inPlay && you.ultimate_law_ready));
                ultimateLawBtn.disabled = !(inPlay && you.ultimate_law_ready && selectedTarget && targetingMode === 'ultimate_law');
                if (inPlay && you.ultimate_law_ready && targetingMode !== 'ultimate_law') {
                    ultimateLawBtn.disabled = false;
                }

                setHidden(document.getElementById('dyingPassBtn'), !myDying);
                document.getElementById('dyingPassBtn').disabled = !myDying;

                document.getElementById('log').innerHTML = (snap.log || []).slice().reverse().map((l) => `<div>${l}</div>`).join('');
            }

            function clearSelection() {
                selectedId = null;
                selectedIds.clear();
                selectedTarget = null;
                if (targetingMode !== 'benevolence') targetingMode = null;
                if (state) render(state);
            }

            function tryConfirmPlay() {
                if (!state) return;
                if (uiMode === 'discard') {
                    const ids = [...selectedIds];
                    if (!ids.length) return;
                    selectedIds.clear();
                    for (const id of ids) {
                        sock.send('game_action', { action: 'discard_card', instance_id: id }, roomId);
                    }
                    return;
                }
                if (!selectedId) return;
                const card = (state.you?.hand || []).find((c) => c.instance_id === selectedId);
                if (state.phase === 'prompt') {
                    sock.send('game_action', { action: 'respond_dodge', instance_id: selectedId }, roomId);
                } else if (state.phase === 'dying') {
                    sock.send('game_action', { action: 'play_card', instance_id: selectedId }, roomId);
                } else {
                    if (needsOtherTarget(card) && !isPeach(card) && !selectedTarget) {
                        setStatus('请点击座位选择目标', 'error');
                        return;
                    }
                    const payload = { action: 'play_card', instance_id: selectedId };
                    if (isPeach(card)) {
                        payload.target = username;
                    } else if (selectedTarget) {
                        payload.target = selectedTarget;
                    }
                    sock.send('game_action', payload, roomId);
                }
                selectedId = null;
                selectedTarget = null;
                targetingMode = null;
            }

            const sock = new TBK.GameSocket();
            sock.on('error', (msg) => setStatus(msg.payload?.message || '错误', 'error'));
            sock.on('game_state', (msg) => {
                if (msg.room_id && msg.room_id !== roomId) return;
                setStatus('');
                const handIds = new Set((msg.payload?.you?.hand || []).map((c) => c.instance_id));
                if (selectedId && !handIds.has(selectedId)) selectedId = null;
                selectedIds = new Set([...selectedIds].filter((id) => handIds.has(id)));
                const names = new Set((msg.payload?.players || []).map((p) => p.username));
                if (selectedTarget && !names.has(selectedTarget) && selectedTarget !== username) {
                    selectedTarget = null;
                }
                render(msg.payload);
            });
            sock.on('game_started', () => sock.send('get_game_state', {}, roomId));
            sock.on('_open', () => sock.send('get_game_state', {}, roomId));
            sock.connect();

            document.getElementById('playBtn').addEventListener('click', tryConfirmPlay);
            document.getElementById('cancelSelectBtn').addEventListener('click', clearSelection);
            document.getElementById('endPlayBtn').addEventListener('click', () => {
                sock.send('game_action', { action: 'end_play' }, roomId);
            });
            document.getElementById('discardDoneBtn').addEventListener('click', () => {
                sock.send('game_action', { action: 'discard_done' }, roomId);
            });
            document.getElementById('techDiscardBtn').addEventListener('click', () => {
                uiMode = 'tech_discard';
                selectedId = null;
                selectedIds.clear();
                selectedTarget = null;
                targetingMode = null;
                if (state) render(state);
            });
            document.getElementById('techConfirmBtn').addEventListener('click', () => {
                if (selectedIds.size !== 4) {
                    setStatus('请选择恰好 4 张基本牌', 'error');
                    return;
                }
                sock.send('game_action', {
                    action: 'discard_for_tech',
                    instance_ids: [...selectedIds],
                }, roomId);
                selectedIds.clear();
                uiMode = 'play';
            });
            document.getElementById('techCancelBtn').addEventListener('click', () => {
                uiMode = 'play';
                selectedIds.clear();
                if (state) render(state);
            });
            document.getElementById('respondPassBtn').addEventListener('click', () => {
                sock.send('game_action', { action: 'respond_pass' }, roomId);
            });
            document.getElementById('wanderAcceptBtn').addEventListener('click', () => {
                sock.send('game_action', { action: 'wander_accept' }, roomId);
            });
            document.getElementById('wanderPassBtn').addEventListener('click', () => {
                sock.send('game_action', { action: 'wander_pass' }, roomId);
            });
            document.getElementById('benevolenceBtn').addEventListener('click', () => {
                if (!selectedTarget) { setStatus('请点击座位选择仁心目标', 'error'); return; }
                sock.send('game_action', { action: 'benevolence_heal', target: selectedTarget }, roomId);
                selectedTarget = null;
                targetingMode = null;
            });
            document.getElementById('madonnaAcceptBtn').addEventListener('click', () => {
                sock.send('game_action', { action: 'madonna_accept' }, roomId);
            });
            document.getElementById('madonnaPassBtn').addEventListener('click', () => {
                sock.send('game_action', { action: 'madonna_pass' }, roomId);
            });
            document.getElementById('flyingBladeBtn').addEventListener('click', () => {
                sock.send('game_action', { action: 'flying_blade' }, roomId);
            });
            document.getElementById('curvatureBtn').addEventListener('click', () => {
                sock.send('game_action', { action: 'curvature_judge' }, roomId);
            });
            document.getElementById('gravityAcceptBtn').addEventListener('click', () => {
                if (selectedIds.size !== 2) { setStatus('请选择两张手牌', 'error'); return; }
                sock.send('game_action', {
                    action: 'gravity_accept',
                    instance_ids: [...selectedIds],
                }, roomId);
                selectedIds.clear();
            });
            document.getElementById('gravityPassBtn').addEventListener('click', () => {
                sock.send('game_action', { action: 'gravity_pass' }, roomId);
                selectedIds.clear();
            });
            document.getElementById('ultimateLawBtn').addEventListener('click', () => {
                if (targetingMode !== 'ultimate_law') {
                    targetingMode = 'ultimate_law';
                    selectedId = null;
                    selectedTarget = null;
                    if (state) render(state);
                    setStatus('请点击座位选择复制目标');
                    return;
                }
                if (!selectedTarget) { setStatus('请选择复制目标', 'error'); return; }
                sock.send('game_action', { action: 'ultimate_law', target: selectedTarget }, roomId);
                selectedTarget = null;
                targetingMode = null;
            });
            document.getElementById('dyingPassBtn').addEventListener('click', () => {
                sock.send('game_action', { action: 'dying_resolve' }, roomId);
            });
            document.getElementById('recastBtn').addEventListener('click', () => {
                if (!selectedId) return;
                sock.send('game_action', { action: 'recast', instance_id: selectedId }, roomId);
                selectedId = null;
                selectedTarget = null;
            });

            const logDrawer = document.getElementById('logDrawer');
            const logBackdrop = document.getElementById('logBackdrop');
            function setLogOpen(open) {
                logDrawer.classList.toggle('open', open);
                logBackdrop.classList.toggle('open', open);
                logDrawer.setAttribute('aria-hidden', open ? 'false' : 'true');
            }
            document.getElementById('logToggleBtn').addEventListener('click', () => {
                setLogOpen(!logDrawer.classList.contains('open'));
            });
            logBackdrop.addEventListener('click', () => setLogOpen(false));
            document.getElementById('backLobbyLink')?.addEventListener('click', () => {
                window.location.href = '/lobby';
            });
        }
    </script>
</body>
</html>
