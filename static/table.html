<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>三体杀 - 桌面</title>
    <link rel="stylesheet" href="/static/css/tokens.css" />
    <link rel="stylesheet" href="/static/css/shell.css" />
    <link rel="stylesheet" href="/static/css/motion.css?v=20260802a" />
    <link rel="stylesheet" href="/static/css/table-board.css?v=20260802a" />
</head>
<body class="shell-page table-page">
    <div class="table-shell">
    <div class="board">
        <header class="board-top">
            <div class="brand-mini">黑暗森林</div>
            <div class="meta">
                房号 <span id="roomIdDisplay"></span>
                · 阶段 <span id="phaseLabel">—</span>
                · 倒计时 <span id="turnTimer">—</span>
            </div>
            <div class="meta-actions">
                <button class="btn btn-outline btn-compact sfx-toggle" id="sfxToggle" type="button" title="音效开关">音效</button>
                <button class="btn btn-outline btn-compact" id="logToggle" type="button" aria-expanded="false" aria-controls="logDrawer">战报</button>
                <a class="btn btn-outline btn-compact" href="/lobby" id="backLobbyLink">回大厅</a>
            </div>
        </header>

        <div class="seat-ring" id="seatRing"></div>

        <div class="board-arena">
            <div class="table-felt" aria-hidden="true"></div>
            <div class="field-bar" id="fieldBar" hidden>场地：无</div>
            <div class="stage-row">
                <div class="pile deck-pile" id="deckPile" title="科技牌堆" aria-hidden="true">
                    <span>牌堆</span>
                    <span class="pile-count" id="deckCount">∞</span>
                </div>
                <div class="stage idle" id="stage">
                    <div id="stageCardSlot"></div>
                    <div class="stage-text" id="stageText">等待对局</div>
                    <div class="stage-sub" id="stageSub"></div>
                    <div class="recent-log" id="recentLog" aria-live="polite"></div>
                </div>
                <div class="pile discard-pile" id="discardPile" title="弃牌堆" aria-hidden="true">
                    <span>弃牌</span>
                    <span class="pile-count" id="discardCount">0</span>
                </div>
            </div>
        </div>

        <section class="board-self">
            <div class="self-hand-wrap">
                <div class="mode-hint" id="modeHint"></div>
                <div class="hand" id="hand"></div>
            </div>
        </section>

        <div class="action-bar" id="actionBar">
            <button class="btn" id="playBtn" type="button">出牌</button>
            <button class="btn btn-outline" id="cancelSelectBtn" type="button" hidden>取消选牌</button>
            <button class="btn btn-outline" id="endPlayBtn" type="button">结束出牌</button>
            <button class="btn btn-outline" id="discardDoneBtn" type="button" hidden>完成弃牌</button>
            <button class="btn btn-outline" id="techDiscardBtn" type="button">弃置升科技</button>
            <button class="btn btn-outline" id="techConfirmBtn" type="button" hidden>确认升科技</button>
            <button class="btn btn-outline" id="techCancelBtn" type="button" hidden>取消</button>
            <button class="btn btn-outline" id="respondPassBtn" type="button" hidden>不响应</button>
            <span id="choiceBtns" hidden></span>
            <button class="btn btn-outline" id="confirmAcceptBtn" type="button" hidden>确认</button>
            <button class="btn btn-outline" id="confirmPassBtn" type="button" hidden>放弃</button>
            <span id="dynamicActionBtns" hidden></span>
            <button class="btn btn-outline" id="dyingPassBtn" type="button" hidden>结算濒死</button>
            <button class="btn btn-outline" id="recastBtn" type="button">重铸</button>
            <div class="status" id="statusMsg"></div>
        </div>
    </div>

    <aside class="log-drawer" id="logDrawer" hidden>
        <div class="log-drawer-head">
            <h2>战报</h2>
            <button class="btn btn-outline btn-compact" id="logClose" type="button">收起</button>
        </div>
        <div class="log" id="log"></div>
    </aside>
    </div>

    <div class="inspect-panel" id="inspectPanel" hidden></div>
    <div class="card-tip" id="cardTip" hidden></div>
    <script src="/static/app.js?v=20260730j"></script>
    <script src="/static/js/card-markup.js?v=20260802a"></script>
    <script src="/static/js/fx-audio.js?v=20260731a"></script>
    <script src="/static/js/fx-queue.js?v=20260731a"></script>
    <script>
        const username = TBK.requireLogin();
        const roomId = TBK.roomIdFromPathOrQuery();
        if (!username) {}
        else if (!roomId) { window.location.href = '/lobby'; }
        else {
            document.getElementById('roomIdDisplay').textContent = roomId;
            let state = null;
            let selectedId = null;
            let selectedIds = new Set();
            let discardCostId = null; // 古筝等：额外弃置的手牌
            let selectedTarget = null;
            let targetingMode = null; // null | 'card' | 'action' | 'choice_target' | 'soap_heal'
            let pendingChoiceId = null; // choice 选项需选目标时暂存
            let pendingAction = null; // { id, label, action, needs_target } 主动技选目标
            let uiMode = 'play'; // play | discard | tech_discard
            let turnDeadlineMs = null;
            let lastStageKey = '';
            let knownHandIds = new Set();
            let handBootstrapped = false;
            const statusMsg = document.getElementById('statusMsg');
            const turnTimerEl = document.getElementById('turnTimer');
            const cardTip = document.getElementById('cardTip');
            const fxQueue = new TBK.FxQueue({
                username,
                getCardMarkup: (c, opts) => TBK.cardMarkup(c, opts),
            });

            function syncSfxToggle() {
                const btn = document.getElementById('sfxToggle');
                if (!btn || !TBK.sfx) return;
                const on = TBK.sfx.isEnabled();
                btn.textContent = on ? '音效开' : '音效关';
                btn.setAttribute('aria-pressed', on ? 'true' : 'false');
            }
            syncSfxToggle();
            document.getElementById('sfxToggle')?.addEventListener('click', () => {
                if (!TBK.sfx) return;
                TBK.sfx.setEnabled(!TBK.sfx.isEnabled());
                syncSfxToggle();
                if (TBK.sfx.isEnabled()) TBK.sfx.play('play');
            });

            function showCardTip(el, card) {
                if (!cardTip || !card) return;
                cardTip.innerHTML = `<div class="tip-name">${escHtml(card.name || '')}</div>
                    <div class="tip-type">${escHtml(TBK.cardTypeLabel(card))}</div>
                    <div class="tip-text">${escHtml(card.text || '无额外说明')}</div>`;
                cardTip.hidden = false;
                const r = el.getBoundingClientRect();
                const tipW = 240;
                let left = r.left + r.width / 2 - tipW / 2;
                left = Math.max(8, Math.min(left, window.innerWidth - tipW - 8));
                let top = r.top - 12;
                cardTip.style.left = `${left}px`;
                cardTip.style.width = `${tipW}px`;
                // place above if space, else below
                requestAnimationFrame(() => {
                    const h = cardTip.offsetHeight || 80;
                    const y = r.top - h - 10;
                    cardTip.style.top = `${y < 8 ? r.bottom + 8 : y}px`;
                });
            }
            function hideCardTip() {
                if (cardTip) cardTip.hidden = true;
            }

            function captureHandRects(instanceIds) {
                const out = {};
                (instanceIds || []).forEach((id) => {
                    if (!id) return;
                    const el = document.querySelector(`#hand .card[data-id="${CSS.escape(id)}"]`);
                    if (!el) return;
                    const r = el.getBoundingClientRect();
                    out[id] = { x: r.left + r.width / 2, y: r.top + r.height / 2, w: r.width, h: r.height };
                });
                return out;
            }

            function setStatus(text, kind) {
                statusMsg.textContent = text || '';
                statusMsg.className = 'status' + (kind ? ' ' + kind : '');
            }

            function setHidden(el, hidden) {
                if (!el) return;
                if (hidden) el.setAttribute('hidden', '');
                else el.removeAttribute('hidden');
            }

            const SLOT_LABEL = TBK.SLOT_LABEL;
            const TEMP_ASCEND_IDS = TBK.TEMP_ASCEND_IDS;

            function needsOtherTarget(card) {
                const ids = new Set([
                    'ladder_plan', 'ball_lightning', 'sophon', 'wallfacer_plan',
                    'deadline', 'dual_vector', 'great_ravine', 'killer_52',
                    'dx3906', 'reckoning', 'finale', 'four_dimension',
                ]);
                return card && (
                    card.subtype === 'kill'
                    || card.id === 'kill_low' || card.id === 'kill_high' || card.id === 'kill_t3'
                    || ids.has(card.id)
                );
            }

            function needsDiscardCost(card) {
                return card && card.id === 'guzheng_plan';
            }

            function isPeach(card) {
                return card && (card.subtype === 'heal' || card.id === 'peach');
            }

            function isBasic(card) {
                if (!card) return false;
                if (['kill', 'dodge', 'heal', 'visitor'].includes(card.subtype)) return true;
                return card.id === 'peach' || card.id === 'visitor';
            }

            const ASCENSION_LABEL = {
                mech: '机械飞升',
                cyber: '义体飞升',
                gene: '基因飞升',
                psychic: '灵能飞升',
            };

            function statusLines(statuses) {
                const list = statuses || [];
                const pos = list.filter((s) => s.kind === 'positive').map((s) => s.name);
                const neg = list.filter((s) => s.kind === 'negative').map((s) => s.name);
                return `<div class="seat-st"><div class="pos">正面：${pos.length ? pos.join('、') : '无'}</div><div class="neg">负面：${neg.length ? neg.join('、') : '无'}</div></div>`;
            }

            function equipLine(equipment, slot) {
                const card = equipment && equipment[slot];
                const label = SLOT_LABEL[slot] || slot;
                if (card && card.name) {
                    return `<div class="filled">${label}：${card.name}</div>`;
                }
                return `<div>${label}：空</div>`;
            }

            const inspectPanel = document.getElementById('inspectPanel');
            let inspectHideTimer = null;
            let inspectSourceEl = null;

            function hideInspect() {
                if (inspectHideTimer) {
                    clearTimeout(inspectHideTimer);
                    inspectHideTimer = null;
                }
                inspectSourceEl = null;
                if (!inspectPanel) return;
                inspectPanel.hidden = true;
                inspectPanel.innerHTML = '';
            }

            function scheduleHideInspect() {
                if (inspectHideTimer) clearTimeout(inspectHideTimer);
                inspectHideTimer = setTimeout(() => {
                    inspectHideTimer = null;
                    hideInspect();
                }, 220);
            }

            function cancelHideInspect() {
                if (inspectHideTimer) {
                    clearTimeout(inspectHideTimer);
                    inspectHideTimer = null;
                }
            }

            if (inspectPanel) {
                inspectPanel.onmouseenter = () => cancelHideInspect();
                inspectPanel.onmouseleave = () => scheduleHideInspect();
            }

            function escHtml(s) {
                return String(s ?? '')
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;');
            }

            function equipDetailHtml(equipment, slot) {
                const card = equipment && equipment[slot];
                const label = SLOT_LABEL[slot] || slot;
                if (!card || !card.name) {
                    return `<div class="inspect-block"><div class="inspect-h">${label}</div><div class="inspect-muted">空</div></div>`;
                }
                return `<div class="inspect-block"><div class="inspect-h">${label} · ${escHtml(card.name)}</div>
                    <div class="inspect-body">${escHtml(card.text || '（暂无说明）')}</div></div>`;
            }

            function statusDetailHtml(statuses) {
                const list = statuses || [];
                if (!list.length) {
                    return `<div class="inspect-block"><div class="inspect-h">状态</div><div class="inspect-muted">无</div></div>`;
                }
                return `<div class="inspect-block"><div class="inspect-h">状态</div>${list.map((s) => {
                    const kind = s.kind === 'negative' ? 'neg' : 'pos';
                    let meta = '';
                    if (s.value != null && s.unit) meta = ` · 剩余 ${s.value}${s.unit}`;
                    return `<div class="inspect-item ${kind}"><div class="inspect-item-title">${escHtml(s.name || s.id)}${escHtml(meta)}</div>
                        <div class="inspect-body">${escHtml(s.text || '（暂无说明）')}</div></div>`;
                }).join('')}</div>`;
            }

            function skillsDetailHtml(skills) {
                const list = skills || [];
                if (!list.length) {
                    return `<div class="inspect-block"><div class="inspect-h">技能</div><div class="inspect-muted">无</div></div>`;
                }
                return `<div class="inspect-block"><div class="inspect-h">技能</div>${list.map((s) =>
                    `<div class="inspect-item"><div class="inspect-item-title">${s.locked ? '【锁定】' : ''}${escHtml(s.name)}</div>
                        <div class="inspect-body">${escHtml(s.text || '（暂无说明）')}</div></div>`
                ).join('')}</div>`;
            }

            function buildInspectHtml(player, mode) {
                if (!player) return '<div class="inspect-muted">无数据</div>';
                const bits = [];
                if (mode === 'role' || mode === 'seat') {
                    if (player.role_id || player.role_name) {
                        bits.push(`<div class="inspect-portrait">${TBK.portraitHtml(player.role_id, player.role_name, 'inspect-art')}</div>`);
                    }
                    bits.push(`<div class="inspect-title">${escHtml(player.role_name || '未知角色')} · ${escHtml(player.username)}</div>`);
                    bits.push(`<div class="inspect-meta">HP ${player.hp}/${player.max_hp} · 科技${player.tech_level ?? 1} · 手牌 ${player.hand_count ?? 0}`
                        + (player.shield ? ` · 盾${player.shield}` : '')
                        + (player.countdown != null ? ` · 倒计时${player.countdown}` : '')
                        + (player.skills_sealed ? ' · 非锁定技失效' : '')
                        + `</div>`);
                    bits.push(skillsDetailHtml(player.skills));
                    bits.push(statusDetailHtml(player.statuses));
                    if (mode === 'seat') {
                        bits.push(equipDetailHtml(player.equipment, 'ship'));
                        bits.push(equipDetailHtml(player.equipment, 'armor'));
                    }
                } else if (mode === 'equip') {
                    bits.push(`<div class="inspect-title">装备 · ${escHtml(player.username)}</div>`);
                    bits.push(equipDetailHtml(player.equipment, 'ship'));
                    bits.push(equipDetailHtml(player.equipment, 'armor'));
                }
                return bits.join('');
            }

            function positionInspect(anchorEl) {
                const panel = inspectPanel;
                const r = anchorEl.getBoundingClientRect();
                panel.hidden = false;
                const pw = panel.offsetWidth || 280;
                const ph = panel.offsetHeight || 120;
                let left = r.right + 10;
                let top = r.top;
                if (left + pw > window.innerWidth - 8) left = Math.max(8, r.left - pw - 10);
                if (top + ph > window.innerHeight - 8) top = Math.max(8, window.innerHeight - ph - 8);
                if (top < 8) top = 8;
                panel.style.left = `${Math.round(left)}px`;
                panel.style.top = `${Math.round(top)}px`;
            }

            function showInspect(anchorEl, player, mode) {
                cancelHideInspect();
                inspectSourceEl = anchorEl;
                inspectPanel.innerHTML = buildInspectHtml(player, mode);
                positionInspect(anchorEl);
            }

            function bindInspect(el, getPlayer, mode) {
                if (!el) return;
                el.classList.add('inspect-hot');
                el.onmouseenter = () => {
                    const p = typeof getPlayer === 'function' ? getPlayer() : getPlayer;
                    if (!p) return;
                    showInspect(el, p, mode);
                };
                el.onmouseleave = () => scheduleHideInspect();
                // Touch: press to show, release to hide
                el.ontouchstart = (ev) => {
                    const p = typeof getPlayer === 'function' ? getPlayer() : getPlayer;
                    if (!p) return;
                    showInspect(el, p, mode);
                };
                el.ontouchend = () => scheduleHideInspect();
                el.ontouchcancel = () => hideInspect();
            }

            function cardTypeLabel(c) {
                return TBK.cardTypeLabel(c);
            }

            function syncUiMode(snap) {
                const myTurn = snap.current_player === username && snap.phase === 'turn';
                if (!myTurn || snap.phase !== 'turn') {
                    if (uiMode === 'tech_discard') uiMode = 'play';
                    if (snap.phase !== 'turn' || snap.turn_phase !== 'discard') {
                        if (uiMode === 'discard') uiMode = 'play';
                    }
                    return;
                }
                if (snap.turn_phase === 'discard') {
                    if (uiMode !== 'discard') {
                        selectedIds.clear();
                        selectedId = null;
                        selectedTarget = null;
                        targetingMode = null;
                    }
                    uiMode = 'discard';
                    return;
                }
                if (snap.turn_phase === 'play' && uiMode === 'discard') {
                    uiMode = 'play';
                    selectedIds.clear();
                }
                if (snap.turn_phase !== 'play' && uiMode === 'tech_discard') {
                    uiMode = 'play';
                    selectedIds.clear();
                }
            }

            function discardNeed(snap) {
                const you = snap.you || {};
                const handCount = (you.hand || []).length;
                const limit = you.hand_limit ?? handCount;
                return Math.max(0, handCount - limit);
            }

            /** Corner seats relative to self (rotated[0] = self at BL). */
            function seatCornerSlots(count) {
                // Returns array of { corner, isSelf } aligned with rotated order indices.
                // Corners: bl | tl | tr | br
                if (count <= 0) return [];
                if (count === 1) return [{ corner: 'bl', isSelf: true }];
                if (count === 2) {
                    return [
                        { corner: 'bl', isSelf: true },
                        { corner: 'tr', isSelf: false },
                    ];
                }
                if (count === 3) {
                    return [
                        { corner: 'bl', isSelf: true },
                        { corner: 'tl', isSelf: false },
                        { corner: 'tr', isSelf: false },
                    ];
                }
                // 4+
                return [
                    { corner: 'bl', isSelf: true },
                    { corner: 'tl', isSelf: false },
                    { corner: 'tr', isSelf: false },
                    { corner: 'br', isSelf: false },
                ].slice(0, count);
            }

            function buildSeatPanelHtml(p, snap, ctx, legal, canPickSeat, corner, isSelf) {
                const isVictim = ctx.isDying && p.username === ctx.dying.victim;
                const isLegal = legal.includes(p.username);
                const cls = [
                    'seat-panel',
                    'seat-corner',
                    `seat-corner--${corner}`,
                    isSelf ? 'seat-self' : '',
                    (!ctx.isPrompt && !ctx.isDying && p.username === snap.current_player) ? 'turn' : '',
                    isVictim ? 'dying-victim deterrence-pulse' : '',
                    (ctx.isPrompt && p.username === ctx.prompt.to) ? 'prompt-active' : '',
                    p.alive ? '' : 'dead',
                    p.online === false ? 'offline' : '',
                    selectedTarget === p.username ? 'selected-target' : '',
                    canPickSeat && isLegal ? 'targetable' : '',
                    canPickSeat && !isLegal ? 'dim-target' : '',
                ].filter(Boolean).join(' ');
                const flags = [];
                if (p.vision_exposed) flags.push('视野暴露');
                if (p.skills_sealed) flags.push('技封');
                if (p.ascension) flags.push(ASCENSION_LABEL[p.ascension] || p.ascension);
                if (!p.alive) flags.push('出局');
                const roleLabel = p.role_name ? `<div class="seat-role">${p.role_name}</div>` : '';
                const artClass = isSelf ? 'seat-art self-art' : 'seat-art';
                const art = TBK.portraitHtml(p.role_id, p.role_name, artClass);
                const you = snap.you || {};
                const skillText = isSelf
                    ? (you.role?.skills || p.skills || []).map((s) =>
                        `${s.locked ? '【锁定】' : ''}${s.name}`
                    ).join(' · ')
                    : '';
                const sealedYou = isSelf && you.skills_sealed ? ' · 非锁定技失效' : '';
                const handBit = isSelf
                    ? `上限${you.hand_limit ?? '—'}`
                    : `手牌 ${p.hand_count}`;
                const hp = isSelf ? (you.hp ?? p.hp) : p.hp;
                const maxHp = p.max_hp ?? hp;
                const tech = isSelf ? (you.tech_level ?? p.tech_level ?? 1) : (p.tech_level ?? 1);
                return `<div class="${cls}" data-user="${p.username}" data-corner="${corner}">
                    ${art}
                    <div class="seat-overlay">
                        <div class="seat-name">${p.username}${p.online === false ? '<span class="badge-off">离线</span>' : ''}${isSelf ? '<span class="badge-self">我</span>' : ''}</div>
                        ${roleLabel}
                        <div class="seat-stats">科技${tech} · ${handBit}${p.shield ? ` · 盾${p.shield}` : ''}${sealedYou}</div>
                        <div class="hp-row${(hp > 0 && hp <= 2) ? ' hp-low' : ''}">${hpPips(hp, maxHp)}</div>
                        <div class="seat-eq">${equipLine(p.equipment, 'ship')}${equipLine(p.equipment, 'armor')}</div>
                        ${skillText ? `<div class="seat-skills">${skillText}</div>` : ''}
                        ${statusLines(p.statuses)}
                        ${flags.length ? `<div class="seat-flags">${flags.join(' · ')}</div>` : ''}
                    </div>
                </div>`;
            }

            /** Relative seat positions: self at bottom-left corner. */
            function seatPositions(count) {
                // Kept for compatibility; corners handled via seatCornerSlots.
                return seatCornerSlots(count).filter((s) => !s.isSelf).map((s) => ({ corner: s.corner }));
            }

            function hpPips(hp, maxHp) {
                const maxShow = Math.min(Math.max(maxHp || 0, 0), 12);
                let html = '';
                for (let i = 0; i < maxShow; i++) {
                    html += `<span class="hp-pip${i < hp ? '' : ' empty'}"></span>`;
                }
                return html;
            }

            function legalTargets(snap, mode, card) {
                const players = snap.players || [];
                const others = players.filter((p) => p.alive && p.username !== username);
                const allAlive = players.filter((p) => p.alive);
                if (mode === 'action') return others.map((p) => p.username);
                if (mode === 'choice_target' || mode === 'soap_heal') return allAlive.map((p) => p.username);
                if (!card) return [];
                if (isPeach(card) && snap.phase === 'dying' && snap.dying) {
                    return [snap.dying.victim];
                }
                if (isPeach(card)) return [username];
                if (card.id === 'ladder_plan') {
                    return others.filter((p) => !p.vision_exposed).map((p) => p.username);
                }
                // 四维：任意名角色（含自己）；UI 先支持单选一名
                if (card.id === 'four_dimension') {
                    return allAlive.map((p) => p.username);
                }
                if (needsOtherTarget(card)) return others.map((p) => p.username);
                return [];
            }

            function syncTargetingFromSelection(snap) {
                const hand = snap.you?.hand || [];
                const card = hand.find((c) => c.instance_id === selectedId);
                const prompt = snap.prompt;

                if (targetingMode === 'choice_target' && pendingChoiceId && prompt?.type === 'choice' && prompt.to === username) {
                    return;
                }
                if (targetingMode === 'soap_heal' && prompt?.type === 'soap_heal' && prompt.to === username) {
                    return;
                }
                if (targetingMode === 'action' && pendingAction && !selectedId) {
                    return;
                }
                if (prompt?.type === 'soap_heal' && prompt.to === username) {
                    targetingMode = 'soap_heal';
                    pendingAction = null;
                    return;
                }
                if (uiMode === 'discard' || uiMode === 'tech_discard') {
                    targetingMode = null;
                    pendingAction = null;
                    selectedTarget = null;
                    return;
                }
                if (card && needsOtherTarget(card) && !(isPeach(card))) {
                    targetingMode = 'card';
                    pendingAction = null;
                    const legal = legalTargets(snap, 'card', card);
                    if (selectedTarget && !legal.includes(selectedTarget)) selectedTarget = null;
                    return;
                }
                if (card && isPeach(card) && snap.phase === 'dying') {
                    targetingMode = null;
                    pendingAction = null;
                    selectedTarget = snap.dying?.victim || null;
                    return;
                }
                targetingMode = null;
                pendingChoiceId = null;
                pendingAction = null;
                if (!needsOtherTarget(card)) selectedTarget = isPeach(card) ? username : null;
            }

            setInterval(() => {
                const felt = document.querySelector('.table-felt');
                if (!turnDeadlineMs || !state || !['turn', 'prompt', 'dying'].includes(state.phase)) {
                    turnTimerEl.textContent = '—';
                    felt?.classList.remove('urgency-pulse');
                    return;
                }
                const remainingSec = Math.max(0, (turnDeadlineMs - Date.now()) / 1000);
                const left = Math.ceil(remainingSec);
                turnTimerEl.textContent = left + 's';

                const total = Number(state.turn_seconds) || 25;
                const urgencyWindow = Math.max(0.1, total - 10);
                const elapsed = total - remainingSec;
                const active = elapsed >= 10 && remainingSec > 0;
                const ratio = Math.min(1, Math.max(0, remainingSec / urgencyWindow));
                const period = Math.min(4.0, Math.max(1.2, 1.2 + 2.8 * ratio));
                if (felt) {
                    felt.style.setProperty('--urgency-period', period.toFixed(2) + 's');
                    felt.classList.toggle('urgency-pulse', active);
                }
            }, 200);

            function renderStage(snap) {
                const stageEl = document.getElementById('stage');
                const stageCardSlot = document.getElementById('stageCardSlot');
                const stageText = document.getElementById('stageText');
                const stageSub = document.getElementById('stageSub');
                const st = snap.stage || {};
                const key = `${st.kind}|${st.text}|${st.card?.name || ''}|${snap.seq || ''}`;
                stageEl.className = 'stage';
                if (st.kind === 'dying') stageEl.classList.add('dying', 'deterrence-pulse');
                else if (st.kind === 'ended') stageEl.classList.add('ended', 'ended-banner');
                else if (!st.kind || st.kind === 'idle') stageEl.classList.add('idle');

                if (st.card && st.card.name) {
                    const enter = key !== lastStageKey ? ' stage-enter stage-card' : ' stage-card';
                    stageCardSlot.innerHTML = TBK.cardMarkup(st.card, { compact: true, extraClass: enter });
                } else {
                    stageCardSlot.innerHTML = '';
                }
                stageText.textContent = st.text || (snap.current_player ? `${snap.current_player} 的回合` : '等待');
                const bits = [];
                if (st.from) bits.push(`来自 ${st.from}`);
                if (st.to) bits.push(`目标 ${st.to}`);
                stageSub.textContent = bits.join(' · ');
                lastStageKey = key;
            }

            function renderSeats(snap, ctx) {
                const order = snap.player_order || (snap.players || []).map((p) => p.username);
                const myIdx = order.indexOf(username);
                const rotated = myIdx >= 0
                    ? [...order.slice(myIdx), ...order.slice(0, myIdx)]
                    : order.slice();
                const slots = seatCornerSlots(rotated.length);
                document.querySelector('.board')?.classList.toggle(
                    'has-br',
                    slots.some((s) => s && s.corner === 'br'),
                );
                const playersByName = Object.fromEntries((snap.players || []).map((p) => [p.username, p]));
                const legal = (() => {
                    if (targetingMode === 'action') return legalTargets(snap, 'action', null);
                    if (targetingMode === 'choice_target') return legalTargets(snap, 'choice_target', null);
                    if (targetingMode === 'soap_heal') return legalTargets(snap, 'soap_heal', null);
                    if (targetingMode === 'card') {
                        const card = (snap.you?.hand || []).find((c) => c.instance_id === selectedId);
                        return legalTargets(snap, 'card', card);
                    }
                    return [];
                })();
                const canPickSeat = legal.length > 0;

                const ring = document.getElementById('seatRing');
                ring.innerHTML = rotated.map((name, i) => {
                    const p = playersByName[name];
                    const slot = slots[i];
                    if (!p || !slot) return '';
                    return buildSeatPanelHtml(p, snap, ctx, legal, canPickSeat, slot.corner, !!slot.isSelf);
                }).join('');

                ring.querySelectorAll('.seat-panel.targetable').forEach((el) => {
                    if (el.classList.contains('seat-self')) return;
                    el.addEventListener('click', () => {
                        const user = el.getAttribute('data-user');
                        if (targetingMode === 'choice_target' && pendingChoiceId) {
                            sock.send('game_action', {
                                action: 'choose',
                                choice: pendingChoiceId,
                                target: user,
                            }, roomId);
                            pendingChoiceId = null;
                            targetingMode = null;
                            selectedTarget = null;
                            return;
                        }
                        if (targetingMode === 'soap_heal') {
                            sock.send('game_action', { action: 'choose', target: user }, roomId);
                            selectedTarget = null;
                            return;
                        }
                        if (targetingMode === 'action' && pendingAction) {
                            selectedTarget = user;
                            sock.send('game_action', {
                                action: pendingAction.action,
                                target: user,
                            }, roomId);
                            pendingAction = null;
                            targetingMode = null;
                            selectedTarget = null;
                            return;
                        }
                        selectedTarget = user;
                        setStatus(`目标：${selectedTarget}`);
                        render(state);
                    });
                });
                ring.querySelectorAll('.seat-panel').forEach((el) => {
                    const uname = el.getAttribute('data-user');
                    if (!el.classList.contains('seat-self')) {
                        bindInspect(el, () => (state?.players || []).find((p) => p.username === uname), 'seat');
                    }
                });
                if (inspectSourceEl && !document.body.contains(inspectSourceEl)) {
                    hideInspect();
                }
            }

            function render(snap) {
                state = snap;
                turnDeadlineMs = snap.turn_deadline_ms || null;
                syncUiMode(snap);
                syncTargetingFromSelection(snap);
                document.getElementById('discardCount').textContent = snap.discard_count ?? 0;
                const deckCountEl = document.getElementById('deckCount');
                if (deckCountEl) {
                    deckCountEl.textContent = snap.deck_count == null ? '∞' : String(snap.deck_count);
                }
                const phaseMap = { turn: '回合', prompt: '响应', dying: '濒死', ended: '结束' };
                const tp = snap.turn_phase ? ({ draw: '摸牌', play: '出牌', discard: '弃牌' }[snap.turn_phase] || snap.turn_phase) : '';
                document.getElementById('phaseLabel').textContent = (phaseMap[snap.phase] || snap.phase) + (tp ? '/' + tp : '');

                const prompt = snap.prompt;
                const dying = snap.dying;
                const isPrompt = snap.phase === 'prompt' && prompt;
                const isDying = snap.phase === 'dying' && dying;
                const myTurn = snap.current_player === username && snap.phase === 'turn';
                const confirmMeta = isPrompt && prompt.confirm ? prompt.confirm : null;
                const myConfirm = !!(confirmMeta && prompt.to === username);
                const needsConfirmCards = myConfirm && Number(confirmMeta.needs_cards || 0) > 0;
                const confirmCardNeed = needsConfirmCards ? Number(confirmMeta.needs_cards) : 0;
                const isChoice = isPrompt && prompt.type === 'choice';
                const isInterrupt = isPrompt && (prompt.type === 'interrupt_trick' || prompt.type === 'respond_toxic');
                const myChoice = isChoice && prompt.to === username;
                const myInterrupt = isInterrupt && prompt.to === username;
                const isDodgePrompt = isPrompt && prompt.type === 'respond_dodge';
                const isSoapPrompt = isPrompt && prompt.type === 'soap_heal';
                const mySoap = isSoapPrompt && prompt.to === username;
                const myPrompt = isPrompt && prompt.to === username;
                const myDying = isDying && dying.victim === username;
                const canSaveDying = isDying && snap.you?.alive !== false;
                const inPlay = myTurn && snap.turn_phase === 'play';
                const inDiscard = myTurn && snap.turn_phase === 'discard';
                const need = discardNeed(snap);

                const ctx = { isPrompt, isDying, dying, prompt };
                document.body.classList.toggle('table-ended', snap.phase === 'ended');
                renderStage(snap);
                renderSeats(snap, ctx);

                const hint = document.getElementById('modeHint');
                if (uiMode === 'tech_discard') {
                    hint.textContent = `弃置升科技：已选 ${selectedIds.size}/4 张基本牌`;
                } else if (inDiscard) {
                    hint.textContent = need > 0
                        ? `弃牌阶段：还需弃置 ${need} 张（已选 ${selectedIds.size}）`
                        : '手牌已达上限，可点击「完成弃牌」';
                } else if (myConfirm && needsConfirmCards) {
                    hint.textContent = `请先选 ${confirmCardNeed} 张手牌，再点「${confirmMeta.accept_label}」`;
                } else if (myConfirm) {
                    hint.textContent = snap.stage?.text || '请选择确认或放弃';
                } else if (myChoice && prompt.card_id === 'hold_sword') {
                    const n = prompt.use_count ?? prompt.meta?.damage;
                    hint.textContent = n != null
                        ? `【执剑】后续：重置技能，或承受 ${n} 点真实伤害`
                        : (snap.stage?.text || '请选择执剑后续');
                } else if (mySoap) {
                    hint.textContent = '香皂：点击座位选择回复目标';
                } else if (isDying) {
                    hint.textContent = myDying
                        ? '你濒死：打出桃自救，或点击「结算濒死」'
                        : `${dying.victim} 濒死：可打出桃救人`;
                } else if (targetingMode === 'action' && pendingAction) {
                    hint.textContent = selectedTarget
                        ? `${pendingAction.label}目标 ${selectedTarget}`
                        : `${pendingAction.label}：点击座位选择目标`;
                } else if (targetingMode === 'choice_target' && pendingChoiceId) {
                    hint.textContent = '古筝：点击座位选择要弃牌的角色';
                } else if (selectedId && needsDiscardCost((snap.you?.hand || []).find((c) => c.instance_id === selectedId))) {
                    hint.textContent = discardCostId
                        ? '古筝：已选弃置牌 · 点击「出牌」确认'
                        : '古筝：再点选一张手牌作为弃置，然后点「出牌」';
                } else if (targetingMode === 'card' && selectedId) {
                    hint.textContent = selectedTarget
                        ? `已选目标 ${selectedTarget} · 点击「出牌」确认`
                        : '请点击座位选择目标';
                } else if (inPlay) {
                    hint.textContent = '出牌阶段：点选手牌，需要目标时再点座位，然后确认';
                } else {
                    hint.textContent = '';
                }

                const you = snap.you || {};
                const mePublic = (snap.players || []).find((p) => p.username === username) || {};

                const selfCorner = document.querySelector('.seat-panel.seat-self');
                const cardForSelf = (snap.you?.hand || []).find((c) => c.instance_id === selectedId);
                const canPickSelfCard = targetingMode === 'card'
                    && cardForSelf
                    && cardForSelf.id === 'four_dimension'
                    && legalTargets(snap, 'card', cardForSelf).includes(username);
                const canPickSelfChoice = (targetingMode === 'choice_target' && !!pendingChoiceId)
                    || targetingMode === 'soap_heal'
                    || canPickSelfCard;
                if (selfCorner) {
                    selfCorner.classList.toggle('selected-target', selectedTarget === username && canPickSelfChoice);
                    selfCorner.style.cursor = canPickSelfChoice ? 'pointer' : '';
                    selfCorner.onclick = canPickSelfChoice ? (ev) => {
                        ev.stopPropagation();
                        if (targetingMode === 'soap_heal') {
                            sock.send('game_action', { action: 'choose', target: username }, roomId);
                            return;
                        }
                        if (canPickSelfCard) {
                            selectedTarget = username;
                            setStatus(`目标：${selectedTarget}`);
                            render(state);
                            return;
                        }
                        sock.send('game_action', {
                            action: 'choose',
                            choice: pendingChoiceId,
                            target: username,
                        }, roomId);
                        pendingChoiceId = null;
                        targetingMode = null;
                        selectedTarget = null;
                    } : null;
                }

                if (selfCorner) {
                    bindInspect(selfCorner, () => (state?.players || []).find((p) => p.username === username) || mePublic, 'role');
                }

                const fieldBar = document.getElementById('fieldBar');
                if (fieldBar) {
                    const fields = snap.fields || [];
                    const bits = fields.map((f) => f.name || f.id).filter(Boolean);
                    if (snap.field_multiplier && snap.field_multiplier !== 1) {
                        bits.push(`倍率×${snap.field_multiplier}`);
                    }
                    if (snap.trisolaris_era) {
                        bits.push(`三体·${snap.trisolaris_era === 'stable' ? '恒纪元' : snap.trisolaris_era}`);
                    }
                    if (bits.length) {
                        fieldBar.hidden = false;
                        fieldBar.innerHTML = `场地：${bits.map((b) => escHtml(b)).join(' · ')}`;
                    } else {
                        fieldBar.hidden = false;
                        fieldBar.innerHTML = '<span class="field-muted">场地：无</span>';
                    }
                }

                const hand = you.hand || [];
                const handEl = document.getElementById('hand');
                const multiSelect = uiMode === 'discard' || uiMode === 'tech_discard' || needsConfirmCards;
                const fanTotal = hand.length;
                handEl.innerHTML = hand.map((c, i) => {
                    let dim = false;
                    const ptype = prompt && prompt.type;
                    if (myConfirm || isChoice || isSoapPrompt) {
                        dim = !needsConfirmCards;
                    } else if (ptype === 'interrupt_trick' || ptype === 'respond_toxic') {
                        const ok = c.id === 'thought_stamp' || c.id === 'return_motion'
                            || (ptype === 'respond_toxic' && (c.subtype === 'kill' || c.id === 'thought_stamp'));
                        dim = !ok;
                    } else if (ptype === 'respond_dodge') {
                        dim = c.subtype !== 'dodge';
                    } else if (isPrompt) {
                        dim = true;
                    }
                    if (isDying) dim = !(c.subtype === 'heal' || c.id === 'peach');
                    if (uiMode === 'tech_discard' && !isBasic(c)) dim = true;
                    const selected = multiSelect
                        ? selectedIds.has(c.instance_id)
                        : (selectedId === c.instance_id || discardCostId === c.instance_id);
                    const isNew = handBootstrapped && !knownHandIds.has(c.instance_id);
                    return TBK.cardMarkup(c, {
                        selected,
                        dim,
                        fanIndex: i,
                        fanTotal,
                        extraClass: isNew ? 'card-enter' : '',
                    });
                }).join('') || '<div style="color:rgba(255,255,255,0.25);font-size:13px;padding:20px;">无手牌</div>';
                knownHandIds = new Set(hand.map((c) => c.instance_id));
                handBootstrapped = true;

                handEl.querySelectorAll('.card').forEach((el) => {
                    const id = el.getAttribute('data-id');
                    const card = hand.find((c) => c.instance_id === id);
                    el.addEventListener('mouseenter', () => showCardTip(el, card));
                    el.addEventListener('mouseleave', hideCardTip);
                    el.addEventListener('click', () => {
                        hideCardTip();
                        if (el.classList.contains('dim')) return;
                        const id = el.getAttribute('data-id');
                        if (uiMode === 'discard') {
                            if (selectedIds.has(id)) selectedIds.delete(id);
                            else selectedIds.add(id);
                            selectedId = null;
                            render(state);
                            return;
                        }
                        if (uiMode === 'tech_discard') {
                            const card = hand.find((c) => c.instance_id === id);
                            if (!isBasic(card)) return;
                            if (selectedIds.has(id)) selectedIds.delete(id);
                            else if (selectedIds.size < 4) selectedIds.add(id);
                            selectedId = null;
                            render(state);
                            return;
                        }
                        if (needsConfirmCards) {
                            if (selectedIds.has(id)) selectedIds.delete(id);
                            else if (selectedIds.size < confirmCardNeed) selectedIds.add(id);
                            selectedId = null;
                            render(state);
                            return;
                        }
                        // 古筝：已选主牌后，再点其他牌作为弃置代价
                        const mainCard = selectedId ? hand.find((c) => c.instance_id === selectedId) : null;
                        if (mainCard && needsDiscardCost(mainCard) && id !== selectedId) {
                            discardCostId = discardCostId === id ? null : id;
                            render(state);
                            return;
                        }
                        if (selectedId === id) {
                            selectedId = null;
                            discardCostId = null;
                            selectedTarget = null;
                            if (targetingMode !== 'action') targetingMode = null;
                        } else {
                            selectedId = id;
                            discardCostId = null;
                            selectedIds.clear();
                            pendingAction = null;
                            targetingMode = null;
                            const card = hand.find((c) => c.instance_id === id);
                            if (card && needsOtherTarget(card) && !isPeach(card)) {
                                targetingMode = 'card';
                                selectedTarget = null;
                            } else if (isPeach(card)) {
                                selectedTarget = isDying ? dying.victim : username;
                            } else {
                                selectedTarget = null;
                            }
                        }
                        render(state);
                    });
                });

                // —— Action bar visibility ——
                const playBtn = document.getElementById('playBtn');
                const cancelSelectBtn = document.getElementById('cancelSelectBtn');
                const selectedCard = hand.find((c) => c.instance_id === selectedId);
                const needsTarget = selectedCard && needsOtherTarget(selectedCard) && !isPeach(selectedCard);
                const hasRequiredTarget = !needsTarget || !!selectedTarget;
                const hasDiscardCost = !needsDiscardCost(selectedCard) || !!discardCostId;
                const allowPromptPlay = myPrompt && !myConfirm && !isChoice && !isSoapPrompt;

                let canPlay = ((inPlay && uiMode === 'play') || allowPromptPlay || canSaveDying) && selectedId && hasRequiredTarget && hasDiscardCost;
                playBtn.disabled = !canPlay;
                playBtn.textContent =
                    inDiscard ? '弃置所选'
                    : (uiMode === 'tech_discard' ? '—'
                    : (isDying && !myDying ? '救人'
                    : (isDying ? '自救'
                    : (isDodgePrompt && myPrompt ? '出闪'
                    : (isInterrupt && myInterrupt ? '打出响应' : '出牌')))));
                if (inDiscard) {
                    playBtn.disabled = selectedIds.size === 0;
                    playBtn.textContent = '弃置所选';
                    setHidden(playBtn, false);
                } else if (uiMode === 'tech_discard' || myConfirm || isChoice || isSoapPrompt) {
                    setHidden(playBtn, true);
                } else {
                    setHidden(playBtn, false);
                }

                setHidden(cancelSelectBtn, !(selectedId || selectedIds.size || discardCostId || targetingMode === 'action'));
                cancelSelectBtn.disabled = false;

                setHidden(document.getElementById('endPlayBtn'), inDiscard || uiMode === 'tech_discard' || myConfirm || isPrompt || isDying);
                document.getElementById('endPlayBtn').disabled = !(inPlay && uiMode === 'play');

                const discardDoneBtn = document.getElementById('discardDoneBtn');
                setHidden(discardDoneBtn, !inDiscard);
                discardDoneBtn.disabled = !(inDiscard && need === 0);

                const techDiscardBtn = document.getElementById('techDiscardBtn');
                const techConfirmBtn = document.getElementById('techConfirmBtn');
                const techCancelBtn = document.getElementById('techCancelBtn');
                setHidden(techDiscardBtn, !(inPlay && uiMode === 'play'));
                techDiscardBtn.disabled = !inPlay;
                setHidden(techConfirmBtn, uiMode !== 'tech_discard');
                setHidden(techCancelBtn, uiMode !== 'tech_discard');
                techConfirmBtn.disabled = !(uiMode === 'tech_discard' && selectedIds.size === 4);

                setHidden(document.getElementById('recastBtn'), inDiscard || uiMode === 'tech_discard' || myConfirm || isPrompt || isDying);
                document.getElementById('recastBtn').disabled = !(inPlay && uiMode === 'play' && selectedId);

                const respondPassBtn = document.getElementById('respondPassBtn');
                const hidePassTypes = myConfirm || isChoice || isSoapPrompt;
                setHidden(respondPassBtn, !(isPrompt && !hidePassTypes));
                respondPassBtn.disabled = !(myPrompt || myInterrupt) || hidePassTypes;
                respondPassBtn.textContent = isInterrupt ? '不响应/不打断' : '不响应';

                const choiceBtns = document.getElementById('choiceBtns');
                if (isChoice && myChoice) {
                    setHidden(choiceBtns, false);
                    choiceBtns.innerHTML = (prompt.options || []).map((o) =>
                        `<button class="btn${pendingChoiceId === o.id ? ' selected' : ''}" type="button" data-choice="${o.id}" data-needs-target="${o.needs_target ? '1' : '0'}">${o.label}</button>`
                    ).join('');
                    choiceBtns.querySelectorAll('button').forEach((btn) => {
                        btn.addEventListener('click', () => {
                            const choice = btn.getAttribute('data-choice');
                            const needsT = btn.getAttribute('data-needs-target') === '1';
                            if (needsT) {
                                pendingChoiceId = choice;
                                targetingMode = 'choice_target';
                                selectedTarget = null;
                                setStatus('请点击座位选择目标');
                                render(state);
                                return;
                            }
                            pendingChoiceId = null;
                            targetingMode = null;
                            sock.send('game_action', { action: 'choose', choice }, roomId);
                        });
                    });
                } else {
                    setHidden(choiceBtns, true);
                    choiceBtns.innerHTML = '';
                    if (!isChoice) {
                        pendingChoiceId = null;
                        if (targetingMode === 'choice_target') targetingMode = null;
                    }
                }

                const confirmAcceptBtn = document.getElementById('confirmAcceptBtn');
                const confirmPassBtn = document.getElementById('confirmPassBtn');
                setHidden(confirmAcceptBtn, !myConfirm);
                setHidden(confirmPassBtn, !myConfirm);
                if (myConfirm) {
                    confirmAcceptBtn.textContent = confirmMeta.accept_label || '确认';
                    confirmPassBtn.textContent = confirmMeta.pass_label || '放弃';
                    confirmAcceptBtn.disabled = needsConfirmCards && selectedIds.size !== confirmCardNeed;
                    confirmPassBtn.disabled = false;
                }

                const dynamicActionBtns = document.getElementById('dynamicActionBtns');
                const playActions = (inPlay && uiMode === 'play') ? (you.actions || []) : [];
                const promptExtras = (myPrompt && Array.isArray(prompt?.extra_actions)) ? prompt.extra_actions : [];
                const dynActions = [...playActions, ...promptExtras];
                if (dynActions.length) {
                    setHidden(dynamicActionBtns, false);
                    dynamicActionBtns.innerHTML = dynActions.map((a) => {
                        const active = targetingMode === 'action' && pendingAction && pendingAction.id === a.id;
                        return `<button class="btn btn-outline${active ? ' selected' : ''}" type="button" data-action-id="${a.id}">${a.label}</button>`;
                    }).join('');
                    dynamicActionBtns.querySelectorAll('button').forEach((btn) => {
                        btn.addEventListener('click', () => {
                            const id = btn.getAttribute('data-action-id');
                            const meta = dynActions.find((a) => a.id === id);
                            if (!meta) return;
                            if (meta.needs_target) {
                                pendingAction = meta;
                                targetingMode = 'action';
                                selectedId = null;
                                selectedTarget = null;
                                setStatus(`请点击座位选择${meta.label}目标`);
                                render(state);
                                return;
                            }
                            sock.send('game_action', { action: meta.action }, roomId);
                            pendingAction = null;
                            targetingMode = null;
                        });
                    });
                } else {
                    setHidden(dynamicActionBtns, true);
                    dynamicActionBtns.innerHTML = '';
                    if (targetingMode === 'action' && !(you.actions || []).length) {
                        pendingAction = null;
                        targetingMode = null;
                    }
                }

                setHidden(document.getElementById('dyingPassBtn'), !myDying);
                document.getElementById('dyingPassBtn').disabled = !myDying;

                const logLines = snap.log || [];
                document.getElementById('log').innerHTML = logLines.slice().reverse().map((l) => `<div>${escHtml(l)}</div>`).join('');
                const recentEl = document.getElementById('recentLog');
                if (recentEl) {
                    const recent = logLines.slice(-3);
                    recentEl.innerHTML = recent.length
                        ? recent.map((l) => `<div class="recent-log-line">${escHtml(l)}</div>`).join('')
                        : '';
                }
            }

            function clearSelection() {
                selectedId = null;
                selectedIds.clear();
                discardCostId = null;
                selectedTarget = null;
                pendingChoiceId = null;
                pendingAction = null;
                targetingMode = null;
                if (state) render(state);
            }

            function tryConfirmPlay() {
                if (!state) return;
                if (uiMode === 'discard') {
                    const ids = [...selectedIds];
                    if (!ids.length) return;
                    selectedIds.clear();
                    for (const id of ids) {
                        sock.send('game_action', { action: 'discard_card', instance_id: id }, roomId);
                    }
                    return;
                }
                if (!selectedId) return;
                const card = (state.you?.hand || []).find((c) => c.instance_id === selectedId);
                const ptype = state.prompt && state.prompt.type;
                if (state.phase === 'prompt') {
                    let actionName = 'play_card';
                    if (ptype === 'respond_dodge') actionName = 'respond_dodge';
                    else if (ptype === 'interrupt_trick' || ptype === 'respond_toxic') actionName = 'play_card';
                    sock.send('game_action', { action: actionName, instance_id: selectedId }, roomId);
                } else if (state.phase === 'dying') {
                    sock.send('game_action', { action: 'play_card', instance_id: selectedId }, roomId);
                } else {
                    if (needsOtherTarget(card) && !isPeach(card) && !selectedTarget) {
                        setStatus('请点击座位选择目标', 'error');
                        return;
                    }
                    if (needsDiscardCost(card) && !discardCostId) {
                        setStatus('古筝需要再弃置一张手牌', 'error');
                        return;
                    }
                    const payload = { action: 'play_card', instance_id: selectedId };
                    if (isPeach(card)) {
                        payload.target = username;
                    } else if (selectedTarget) {
                        payload.target = selectedTarget;
                    }
                    if (discardCostId) payload.discard_instance_id = discardCostId;
                    sock.send('game_action', payload, roomId);
                }
                selectedId = null;
                discardCostId = null;
                selectedTarget = null;
                targetingMode = null;
            }

            const sock = new TBK.GameSocket();
            sock.on('error', (msg) => setStatus(msg.payload?.message || '错误', 'error'));
            sock.on('game_state', (msg) => {
                if (msg.room_id && msg.room_id !== roomId) return;
                setStatus('');
                const payload = msg.payload || {};
                const events = payload.events || [];
                const fromRects = captureHandRects(
                    events
                        .filter((e) => (e.type === 'play' || e.type === 'discard') && e.instance_id)
                        .map((e) => e.instance_id),
                );
                const handIds = new Set((payload.you?.hand || []).map((c) => c.instance_id));
                if (selectedId && !handIds.has(selectedId)) selectedId = null;
                selectedIds = new Set([...selectedIds].filter((id) => handIds.has(id)));
                const names = new Set((payload.players || []).map((p) => p.username));
                if (selectedTarget && !names.has(selectedTarget) && selectedTarget !== username) {
                    selectedTarget = null;
                }
                render(payload);
                if (events.length) fxQueue.enqueue(events, { fromRects });
            });
            sock.on('game_started', () => sock.send('get_game_state', {}, roomId));
            sock.on('_open', () => sock.send('get_game_state', {}, roomId));
            sock.connect();

            document.getElementById('playBtn').addEventListener('click', tryConfirmPlay);
            document.getElementById('cancelSelectBtn').addEventListener('click', clearSelection);
            document.getElementById('endPlayBtn').addEventListener('click', () => {
                sock.send('game_action', { action: 'end_play' }, roomId);
            });
            document.getElementById('discardDoneBtn').addEventListener('click', () => {
                sock.send('game_action', { action: 'discard_done' }, roomId);
            });
            document.getElementById('techDiscardBtn').addEventListener('click', () => {
                uiMode = 'tech_discard';
                selectedId = null;
                selectedIds.clear();
                selectedTarget = null;
                targetingMode = null;
                if (state) render(state);
            });
            document.getElementById('techConfirmBtn').addEventListener('click', () => {
                if (selectedIds.size !== 4) {
                    setStatus('请选择恰好 4 张基本牌', 'error');
                    return;
                }
                sock.send('game_action', {
                    action: 'discard_for_tech',
                    instance_ids: [...selectedIds],
                }, roomId);
                selectedIds.clear();
                uiMode = 'play';
            });
            document.getElementById('techCancelBtn').addEventListener('click', () => {
                uiMode = 'play';
                selectedIds.clear();
                if (state) render(state);
            });
            document.getElementById('respondPassBtn').addEventListener('click', () => {
                sock.send('game_action', { action: 'respond_pass' }, roomId);
            });
            document.getElementById('confirmAcceptBtn').addEventListener('click', () => {
                const meta = state?.prompt?.confirm;
                if (!meta || state?.prompt?.to !== username) return;
                const needCards = Number(meta.needs_cards || 0);
                if (needCards > 0) {
                    if (selectedIds.size !== needCards) {
                        setStatus(`请选择恰好 ${needCards} 张手牌`, 'error');
                        return;
                    }
                    sock.send('game_action', {
                        action: meta.accept_action,
                        instance_ids: [...selectedIds],
                    }, roomId);
                    selectedIds.clear();
                    return;
                }
                sock.send('game_action', { action: meta.accept_action }, roomId);
            });
            document.getElementById('confirmPassBtn').addEventListener('click', () => {
                const meta = state?.prompt?.confirm;
                if (!meta || state?.prompt?.to !== username) return;
                sock.send('game_action', { action: meta.pass_action }, roomId);
                selectedIds.clear();
            });
            document.getElementById('dyingPassBtn').addEventListener('click', () => {
                sock.send('game_action', { action: 'dying_resolve' }, roomId);
            });
            document.getElementById('recastBtn').addEventListener('click', () => {
                if (!selectedId) return;
                sock.send('game_action', { action: 'recast', instance_id: selectedId }, roomId);
                selectedId = null;
                selectedTarget = null;
            });

            const logDrawer = document.getElementById('logDrawer');
            const logToggle = document.getElementById('logToggle');
            function setLogOpen(open) {
                setHidden(logDrawer, !open);
                if (logToggle) logToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
            }
            logToggle?.addEventListener('click', () => {
                setLogOpen(logDrawer?.hasAttribute('hidden'));
            });
            document.getElementById('logClose')?.addEventListener('click', () => setLogOpen(false));
            document.addEventListener('keydown', (ev) => {
                if (ev.key === 'Escape' && logDrawer && !logDrawer.hasAttribute('hidden')) {
                    setLogOpen(false);
                }
            });

            document.getElementById('backLobbyLink')?.addEventListener('click', () => {
                window.location.href = '/lobby';
            });
        }
    </script>
</body>
</html>
